<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07031a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #back{position:fixed;left:14px;bottom:12px;font:700 12px Orbitron,"Malgun Gothic",sans-serif;color:rgba(190,210,255,.8);text-decoration:none;
    padding:6px 10px;border:1px solid rgba(150,180,255,.35);border-radius:8px;background:rgba(10,8,30,.6);letter-spacing:1px;transition:opacity .3s}
  #back:hover{color:#fff;border-color:#8fd8ff}
  #back.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="arcade.html">← 아케이드</a>
<script>
'use strict';
/* =========================================================
   NEON DASH — 네온 엔드리스 러너
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), backLink = document.getElementById('back');
let W = 0, H = 0, DPR = 1, GY = 0, PX = 0, vignette = null, layers = [];
const FONT = 'Orbitron, "Segoe UI", "Malgun Gothic", sans-serif';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
const C = { cyan: '80,220,255', pink: '255,60,160', red: '255,70,70', orange: '255,150,40', gold: '255,210,80', green: '120,255,150', blue: '100,140,255', purple: '190,110,255', white: '255,255,255' };
const GRAV = 2700, JUMP = -930, JUMP2 = -820;

/* ---------- 리사이즈 / 배경 사전 렌더 ---------- */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  GY = Math.round(H * 0.74); PX = Math.max(90, W * 0.22);
  vignette = document.createElement('canvas'); vignette.width = Math.max(1, W); vignette.height = Math.max(1, H);
  const vg = vignette.getContext('2d'), gr = vg.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.6)'); vg.fillStyle = gr; vg.fillRect(0, 0, W, H);
  buildLayers();
}
addEventListener('resize', resize);
function buildLayers() {
  const specs = [
    { col: '#1d1145', hmin: 0.22, hmax: 0.46, sp: 0.08, win: 'rgba(170,140,255,0.35)', neon: 0 },
    { col: '#140b33', hmin: 0.16, hmax: 0.36, sp: 0.2, win: 'rgba(255,150,220,0.4)', neon: 0.15 },
    { col: '#0b0620', hmin: 0.1, hmax: 0.26, sp: 0.45, win: 'rgba(120,230,255,0.55)', neon: 0.4 },
  ];
  layers = specs.map(s => {
    const LW = Math.max(1400, Math.ceil(W * 1.2)), c = document.createElement('canvas');
    c.width = LW; c.height = Math.max(1, GY); const g = c.getContext('2d');
    let x = 0;
    while (x < LW) {
      const w = rand(40, 120), h = rand(s.hmin, s.hmax) * H, top = GY - h;
      if (x + w > LW) break;
      g.fillStyle = s.col; g.fillRect(x, top, w, h);
      if (Math.random() < 0.3) { g.fillRect(x + w * 0.4, top - rand(10, 40), 3, 40); }
      if (Math.random() < 0.25) { g.beginPath(); g.moveTo(x, top); g.lineTo(x + w / 2, top - rand(10, 30)); g.lineTo(x + w, top); g.fill(); }
      g.fillStyle = s.win;
      for (let wy = top + 8; wy < GY - 6; wy += 10) for (let wx = x + 5; wx < x + w - 6; wx += 9) if (Math.random() < 0.28) g.fillRect(wx, wy, 4, 5);
      if (Math.random() < s.neon) {
        const hue = randi(0, 360), sy = top + rand(10, h * 0.4), sw = Math.min(w - 10, rand(20, 60));
        g.shadowColor = `hsl(${hue},100%,60%)`; g.shadowBlur = 14; g.fillStyle = `hsl(${hue},100%,65%)`;
        g.fillRect(x + (w - sw) / 2, sy, sw, 6); g.shadowBlur = 0;
      }
      x += w + rand(2, 18);
    }
    return { c, sp: s.sp, off: 0, LW };
  });
}

const glowCache = new Map();
function glowSprite(rgb) {
  let s = glowCache.get(rgb); if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.14, `rgba(${rgb},0.95)`);
  gr.addColorStop(0.42, `rgba(${rgb},0.28)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache.set(rgb, s); return s;
}
function drawGlow(x, y, size, rgb, alpha = 1) {
  if (size <= 0 || alpha <= 0) return;
  const a = ctx.globalAlpha; ctx.globalAlpha = a * Math.min(1, alpha);
  ctx.drawImage(glowSprite(rgb), x - size / 2, y - size / 2, size, size);
  ctx.globalAlpha = a;
}
function hslRgb(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return `${f(0)},${f(8)},${f(4)}`;
}

/* ---------- 사운드 ---------- */
const Snd = {
  ctx: null, master: null, muted: false, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const A = window.AudioContext || window.webkitAudioContext; this.ctx = new A();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.3; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; this.noise = this.ctx.createBuffer(1, len, len);
      const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok(key, gap) {
    if (!this.ctx || this.muted) return false;
    const n = this.ctx.currentTime;
    if (key) { if (this.last[key] && n - this.last[key] < gap) return false; this.last[key] = n; }
    return true;
  },
  tone(f, dur, type, vol, f2) {
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  burst(dur, vol, freq, f2) {
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur);
  },
  jump() { if (this.ok('jump', 0.05)) this.tone(300, 0.15, 'square', 0.05, 700); },
  jump2() { if (this.ok('jump', 0.05)) this.tone(500, 0.18, 'square', 0.05, 1200); },
  land() { if (this.ok('land', 0.08)) this.burst(0.08, 0.15, 800, 200); },
  slide() { if (this.ok('slide', 0.2)) this.burst(0.3, 0.12, 2500, 400); },
  coin() { if (this.ok('coin', 0.03)) { this.tone(1320, 0.06, 'square', 0.03); setTimeout(() => this.ok() && this.tone(1760, 0.1, 'square', 0.03), 50); } },
  boost() { if (!this.ok()) return; [392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.ok() && this.tone(f, 0.15, 'sawtooth', 0.06), i * 50)); },
  smash() { if (this.ok('smash', 0.05)) { this.burst(0.35, 0.35, 3000, 80); this.tone(180, 0.25, 'sawtooth', 0.08, 40); } },
  die() { if (!this.ok()) return; this.burst(0.9, 0.5, 2500, 50); this.tone(500, 0.8, 'sawtooth', 0.15, 40); },
  mile() { if (!this.ok()) return; [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => this.ok() && this.tone(f, 0.22, 'triangle', 0.1), i * 80)); },
};

/* ---------- 상태 ---------- */
let state = 'title', paused = false;
let player, obs = [], gaps = [], coins = [], parts = [], texts = [], timers = [], trail = [];
let speed = 0, dist = 0, coinCount = 0, best = 0, nextSpawn = 0, lastMile = 0, worldX = 0;
let timeScale = 1, slowT = 0, shake = 0, flash = 0, flashColor = C.white, gtime = 0, announce = null, overT = 0, newRecord = false, coinPop = 0, smashed = 0;
try { best = +localStorage.getItem('neonDashBest') || 0; } catch (e) { best = 0; }
const meters = () => Math.floor(dist / 50);
const score = () => meters() + coinCount * 10 + smashed * 25;

function after(t, fn) { timers.push({ t, fn }); }
function slowmo(s, d) { timeScale = Math.min(timeScale, s); slowT = Math.max(slowT, d); }
function addShake(v) { shake = Math.max(shake, v); }
function doFlash(a, rgb = C.white) { flash = Math.max(flash, a); flashColor = rgb; }
function showAnnounce(title, sub, rgb = C.cyan, dur = 2.2) { announce = { title, sub, rgb, t: 0, dur }; }

/* ---------- 파티클 ---------- */
function P(o) { if (parts.length < 2500) parts.push(o); }
function addGlow(x, y, vx, vy, size, rgb, life, drag = 0, grow = 1) { P({ k: 0, x, y, vx, vy, size, rgb, life, max: life, drag, grow }); }
function addSpark(x, y, vx, vy, rgb, life, w = 2, drag = 2) { P({ k: 1, x, y, vx, vy, rgb, life, max: life, w, drag }); }
function addRing(x, y, r1, r2, rgb, life, w = 4) { P({ k: 2, x, y, vx: 0, vy: 0, r1, r2, rgb, life, max: life, w }); }
function addDust(x, y, vx, vy, size, life) { P({ k: 4, x, y, vx, vy, size, life, max: life, drag: 3 }); }
function addSeg(x, y, dx, dy, vx, vy, rgb) { P({ k: 5, x, y, dx, dy, vx, vy, rgb, life: 2.2, max: 2.2, rot: 0, vr: rand(-14, 14), g: 1800, drag: 0.3 }); }
function addText(x, y, str, s = 16, rgb = C.white, life = 0.8) { texts.push({ x, y, str, s, rgb, life, max: life }); }
function burst(x, y, rgb, n = 24, sp = 500) {
  addGlow(x, y, 0, 0, 120, rgb, 0.3, 0, 1.5); addRing(x, y, 6, 80, rgb, 0.4, 5);
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(sp * 0.3, sp); addSpark(x, y, Math.cos(a) * s, Math.sin(a) * s, i % 2 ? rgb : C.white, rand(0.3, 0.6), 2, 2.5); }
}

/* ---------- 플레이어 자세 ---------- */
// 발 위치(x,y)를 기준으로 선분(관절) 목록과 머리 위치를 계산
function pose(p, x, y) {
  const segs = [];
  const ph = p.phase, lean = p.slide > 0 ? 0 : clamp(speed / 1400, 0.1, 0.5);
  const limb = (ox, oy, a1, l1, a2, l2) => {
    const kx = ox + Math.sin(a1) * l1, ky = oy + Math.cos(a1) * l1;
    const fx = kx + Math.sin(a2) * l2, fy = ky + Math.cos(a2) * l2;
    segs.push([ox, oy, kx, ky], [kx, ky, fx, fy]);
  };
  if (p.slide > 0) {
    const hip = [x - 2, y - 12], sh = [x - 22, y - 26], head = [x - 30, y - 34];
    segs.push([hip[0], hip[1], sh[0], sh[1]]);
    limb(hip[0], hip[1], 1.25, 15, 1.45, 15);
    limb(hip[0], hip[1], 0.7, 13, 1.9, 13);
    limb(sh[0], sh[1], -1.9, 11, -2.6, 10);
    limb(sh[0], sh[1], 2.3, 11, 1.6, 10);
    return { segs, head, hip };
  }
  const hip = [x + lean * 4, y - 30], sh = [x + lean * 14, y - 52], head = [x + lean * 18, y - 62];
  segs.push([hip[0], hip[1], sh[0], sh[1]]);
  if (!p.onGround) {
    const up = p.vy < 0;
    limb(hip[0], hip[1], up ? 1.0 : 0.6, 15, up ? -0.3 : 0.1, 15);
    limb(hip[0], hip[1], up ? -0.4 : -0.1, 15, -0.9, 14);
    limb(sh[0], sh[1], up ? Math.PI * 0.85 : 2.0, 11, up ? Math.PI * 0.95 : 1.4, 10);
    limb(sh[0], sh[1], up ? -2.4 : -1.4, 11, up ? -2.8 : -0.9, 10);
  } else {
    for (const o of [0, Math.PI]) {
      const s = Math.sin(ph + o), a = s * 0.95 + lean * 0.4;
      const bend = 0.25 + 1.3 * Math.max(0, -Math.cos(ph + o));
      limb(hip[0], hip[1], a, 15, a - bend, 15);
      const aa = -s * 1.0 + lean * 0.6;
      limb(sh[0], sh[1], aa, 11, aa + 1.2, 10);
    }
  }
  return { segs, head, hip };
}
function drawRunner(p, x, y, alpha = 1) {
  const { segs, head, hip } = pose(p, 0, 0);
  ctx.save(); ctx.translate(x, y);
  ctx.scale(1 + p.squash * 0.3, 1 - p.squash * 0.32);
  if (p.flip > 0) { ctx.translate(hip[0], hip[1]); ctx.rotate(-(1 - p.flip) * TAU); ctx.translate(-hip[0], -hip[1]); }
  ctx.globalAlpha = alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const body = p.boost > 0 ? hslRgb(gtime * 400, 1, 0.65) : C.cyan;
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(${body},0.35)`; ctx.lineWidth = 10;
  ctx.beginPath(); for (const s of segs) { ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); } ctx.stroke();
  drawGlow(head[0], head[1], 46, C.pink, 0.9);
  drawGlow(hip[0], hip[1] - 10, 60, body, 0.35);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = '#e8fbff'; ctx.lineWidth = 4;
  ctx.beginPath(); for (const s of segs) { ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); } ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(head[0], head[1], 7.5, 0, TAU); ctx.fill();
  // 바이저
  ctx.fillStyle = `rgb(${C.pink})`; ctx.fillRect(head[0] - 1, head[1] - 3, 8, 4);
  // 머리끈 (속도에 따라 휘날림)
  ctx.strokeStyle = `rgba(${C.pink},0.9)`; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(head[0] - 6, head[1] - 2);
  for (let i = 1; i <= 4; i++) ctx.lineTo(head[0] - 6 - i * 6, head[1] - 2 + Math.sin(gtime * 25 - i) * (2 + i));
  ctx.stroke();
  ctx.restore();
}

/* ---------- 장애물 생성 ---------- */
function spawnPattern() {
  const m = meters(), x0 = W + 80;
  const opts = ['spike', 'spike', 'gate', 'pit', 'drone'];
  if (m > 400) opts.push('combo', 'pit', 'drone');
  if (m > 900) opts.push('combo', 'hidrone', 'combo2');
  const t = opts[randi(0, opts.length - 1)];
  let width = 0;
  const coinArc = (cx, w, h = 120, n = 6) => { for (let i = 0; i < n; i++) { const k = i / (n - 1); coins.push({ x: cx - w / 2 + k * w, y: GY - 40 - Math.sin(k * Math.PI) * h, t: rand(0, 6) }); } };
  const coinLine = (x, y, n = 5) => { for (let i = 0; i < n; i++) coins.push({ x: x + i * 34, y, t: rand(0, 6) }); };
  const spike = (x, n) => { obs.push({ type: 'spike', x, w: n * 26, h: 30 }); coinArc(x + n * 13, 120 + n * 26); return n * 26; };
  const gate = x => { obs.push({ type: 'gate', x, w: 18 }); coinLine(x - 50, GY - 14, 4); return 18; };
  const pit = (x) => { const w = clamp(rand(110, 120 + speed * 0.22), 100, 270); gaps.push({ x, w }); coinArc(x + w / 2, w + 60, 140, 7); return w; };
  const drone = (x, hy = 66) => { obs.push({ type: 'drone', x, w: 34, by: GY - hy, t: rand(0, 6) }); if (hy < 100) coinLine(x - 40, GY - 14, 4); return 34; };
  switch (t) {
    case 'spike': width = spike(x0, randi(1, m > 600 ? 3 : 2)); break;
    case 'gate': width = gate(x0); break;
    case 'pit': width = pit(x0); break;
    case 'drone': width = drone(x0); break;
    case 'hidrone': width = drone(x0, 150); coinLine(x0 - 60, GY - 30, 5); break;
    case 'combo': { const a = spike(x0, 1); const gap = Math.max(240, speed * 0.55); width = a + gap + drone(x0 + a + gap); break; }
    case 'combo2': { const a = pit(x0); const gap = Math.max(260, speed * 0.6); width = a + gap + spike(x0 + a + gap, 2); break; }
  }
  if (Math.random() < 0.06 && player.boost <= 0) coins.push({ x: x0 + width + 140, y: GY - 130, t: 0, star: true });
  nextSpawn = width + rand(speed * 0.75, speed * 1.35) + 120;
}

/* ---------- 게임 흐름 ---------- */
function newGame() {
  player = { y: GY, vy: 0, onGround: true, jumps: 0, slide: 0, phase: 0, squash: 0, flip: 0, boost: 0, dead: false, fastFall: false, holdDown: false };
  obs = []; gaps = []; coins = []; parts = []; texts = []; timers = []; trail = [];
  speed = 430; dist = 0; coinCount = 0; smashed = 0; nextSpawn = 500; lastMile = 0;
  timeScale = 1; slowT = 0; shake = 0; flash = 0; overT = 0; newRecord = false; paused = false;
  state = 'play';
  showAnnounce('READY... GO!', '장애물을 피해 끝까지 달려라', C.cyan, 1.8);
}
function jump() {
  const p = player; if (!p || p.dead || state !== 'play' || paused) return;
  if (p.onGround) {
    p.vy = JUMP; p.onGround = false; p.jumps = 1; p.slide = 0; p.squash = -0.6; Snd.jump();
    for (let i = 0; i < 8; i++) addDust(PX + rand(-10, 10), GY, rand(-160, 40), rand(-80, -10), rand(8, 14), 0.4);
  } else if (p.jumps < 2) {
    p.vy = JUMP2; p.jumps = 2; p.flip = 1; p.fastFall = false; Snd.jump2();
    addRing(PX, p.y - 20, 6, 50, C.cyan, 0.35, 3);
    for (let i = 0; i < 12; i++) { const a = Math.PI / 2 + rand(-0.8, 0.8); addSpark(PX, p.y, Math.cos(a) * 300, Math.sin(a) * 300, C.cyan, 0.3, 2); }
  }
}
function releaseJump() { const p = player; if (p && p.vy < -380 && !p.dead) p.vy = -380; }
function slide() {
  const p = player; if (!p || p.dead || state !== 'play' || paused) return;
  if (p.onGround) { if (p.slide <= 0) { Snd.slide(); addShake(2); } p.slide = 0.65; }
  else { p.fastFall = true; p.vy = Math.max(p.vy, 1300); }
}
function die() {
  const p = player; if (p.dead) return;
  p.dead = true; Snd.die(); doFlash(0.6, C.red); addShake(26); slowmo(0.2, 0.9);
  const { segs, head } = pose(p, PX, p.y);
  for (const s of segs) {
    const mx = (s[0] + s[2]) / 2, my = (s[1] + s[3]) / 2;
    addSeg(mx, my, (s[2] - s[0]) / 2, (s[3] - s[1]) / 2, rand(-200, 350), rand(-700, -250), C.cyan);
  }
  addSeg(head[0], head[1], 4, 0, rand(0, 300), -800, C.pink);
  burst(PX, p.y - 30, C.pink, 40, 700);
  for (let i = 0; i < 3; i++) after(0.12 * (i + 1), () => burst(PX + rand(-30, 30), p.y - rand(10, 50), C.cyan, 16, 400));
  after(1.5, () => {
    state = 'over'; overT = 0;
    const s = score(); if (s > best) { best = s; newRecord = true; try { localStorage.setItem('neonDashBest', String(best)); } catch (e) {} }
  });
}
function inGap(x) { for (const g of gaps) if (x > g.x + 8 && x < g.x + g.w - 8) return true; return false; }
function hitbox(p) {
  return p.slide > 0 ? { x: PX - 22, y: p.y - 26, w: 40, h: 24 } : { x: PX - 12, y: p.y - 58, w: 24, h: 56 };
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- 업데이트 ---------- */
function update(dt, rdt) {
  for (let i = timers.length - 1; i >= 0; i--) { const t = timers[i]; t.t -= dt; if (t.t <= 0) { timers.splice(i, 1); t.fn(); } }
  const p = player;
  if (!p.dead) speed = Math.min(1150, speed + dt * (speed < 700 ? 9 : 5));
  else speed *= Math.exp(-dt * 1.5);
  const sp = speed * (p.boost > 0 ? 1.55 : 1);
  const dx = sp * dt;
  if (!p.dead) dist += dx;
  worldX += dx;
  for (const l of layers) l.off = (l.off + dx * l.sp) % l.LW;

  // 스폰
  if (!p.dead) { nextSpawn -= dx; if (nextSpawn <= 0) spawnPattern(); }
  for (const o of obs) { o.x -= dx + (o.type === 'drone' ? 120 * dt : 0); if (o.t !== undefined) o.t += dt; }
  for (const g of gaps) g.x -= dx;
  for (const c of coins) { c.x -= dx; c.t += dt; }
  obs = obs.filter(o => o.x + o.w > -100 && !o.dead);
  gaps = gaps.filter(g => g.x + g.w > -50);

  // 플레이어 물리
  if (!p.dead) {
    p.phase += dt * sp / 34;
    if (p.flip > 0) p.flip = Math.max(0, p.flip - dt * 2.4);
    p.squash *= Math.exp(-dt * 12);
    if (p.slide > 0) { p.slide -= dt; if (p.holdDown && p.onGround) p.slide = Math.max(p.slide, 0.1); if (Math.random() < 0.6) addSpark(PX + 10, GY - 2, rand(-500, -200), rand(-120, -20), C.orange, 0.25, 2); }
    const prevY = p.y;
    p.vy += GRAV * dt * (p.vy > 0 ? 1.25 : 1); p.y += p.vy * dt;
    const solid = !inGap(PX) || p.boost > 0;
    if (p.y >= GY && prevY <= GY + 2 && solid && p.vy >= 0) {
      if (!p.onGround) {
        p.squash = clamp(p.vy / 1400, 0.3, 1); Snd.land();
        for (let i = 0; i < 10; i++) addDust(PX + rand(-8, 8), GY, rand(-220, 220), rand(-90, -10), rand(8, 16), 0.5);
        if (p.fastFall || p.holdDown) { p.slide = 0.65; Snd.slide(); }
        p.fastFall = false;
      }
      p.y = GY; p.vy = 0; p.onGround = true; p.jumps = 0;
    } else if (p.onGround && !solid) { p.onGround = false; p.jumps = 1; }
    else if (p.y < GY - 1) p.onGround = false;
    if (p.y > H + 60) die();
    // 러닝 먼지
    if (p.onGround && p.slide <= 0 && Math.random() < 0.3) addDust(PX - 6, GY, rand(-260, -120), rand(-50, -10), rand(5, 9), 0.35);
    // 부스트
    if (p.boost > 0) {
      p.boost -= dt;
      trail.unshift({ y: p.y - 30 }); if (trail.length > 30) trail.pop();
      if (p.boost <= 0) { addText(PX, p.y - 90, 'BOOST END', 14, C.white); trail = []; }
    } else if (trail.length) trail.pop();
    // 충돌
    const hb = hitbox(p);
    for (const o of obs) {
      let box;
      if (o.type === 'spike') box = { x: o.x + 5, y: GY - o.h * 0.75, w: o.w - 10, h: o.h * 0.75 };
      else if (o.type === 'gate') box = { x: o.x, y: 0, w: o.w, h: GY - 38 };
      else box = { x: o.x - 14, y: o.by + Math.sin(o.t * 4) * 8 - 13, w: 28, h: 26 };
      if (!overlap(hb, box)) continue;
      if (p.boost > 0) {
        o.dead = true; smashed++; Snd.smash(); addShake(10);
        burst(box.x + box.w / 2, Math.max(box.y, GY - 80) + Math.min(box.h, 60) / 2, o.type === 'drone' ? C.red : C.orange, 30, 600);
        addText(PX + 40, p.y - 80, 'SMASH! +25', 16, C.gold);
      } else { die(); break; }
    }
    // 코인
    for (const c of coins) {
      if (c.taken) continue;
      const cy = p.y - (p.slide > 0 ? 14 : 30);
      let d = Math.hypot(c.x - PX, c.y - cy);
      if (p.boost > 0 && d < 220) { c.x += (PX - c.x) * Math.min(1, dt * 10); c.y += (cy - c.y) * Math.min(1, dt * 10); d = Math.hypot(c.x - PX, c.y - cy); }
      if (d < 30) {
        c.taken = true;
        if (c.star) {
          p.boost = 5; Snd.boost(); doFlash(0.4, C.gold); addShake(10); slowmo(0.4, 0.25);
          burst(c.x, c.y, C.gold, 40, 700); showAnnounce('BOOST!', '5초간 무적 · 장애물 파괴', C.gold, 1.6);
        } else {
          coinCount++; coinPop = 1; Snd.coin();
          addGlow(c.x, c.y, 0, 0, 40, C.gold, 0.25, 0, 1.6);
          for (let i = 0; i < 5; i++) addSpark(c.x, c.y, rand(-200, 200), rand(-250, 50), C.gold, 0.3, 1.5);
        }
      }
    }
    // 1000m 마다 축하
    const mile = Math.floor(meters() / 1000);
    if (mile > lastMile) {
      lastMile = mile; Snd.mile(); doFlash(0.35, C.cyan);
      showAnnounce(`${mile * 1000} M`, '속도 상승!', C.green, 2.2);
      for (let i = 0; i < 5; i++) after(i * 0.18, () => { const x = rand(W * 0.2, W * 0.9), y = rand(H * 0.12, H * 0.4); burst(x, y, hslRgb(rand(0, 360), 1, 0.6), 36, 500); });
    }
  }
  coins = coins.filter(c => c.x > -40 && !c.taken);

  // 파티클
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= dt;
    if (q.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    if (q.drag) { const d = Math.exp(-q.drag * dt); q.vx *= d; q.vy *= d; }
    if (q.g) q.vy += q.g * dt; if (q.vr) q.rot += q.vr * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.k === 5 && q.y > GY && !inGap(q.x)) { q.y = GY; q.vy *= -0.4; q.vx *= 0.7; q.vr *= 0.6; }
    if (q.k === 0 || q.k === 4) q.x -= dx * 0.5;
  }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt; t.y -= 40 * dt; if (t.life <= 0) texts.splice(i, 1); }
  coinPop = Math.max(0, coinPop - rdt * 4);
}

function drawBackground() {

    ctx.fillRect(gp.x, GY, gp.w, H - GY);

}
function drawObstacles() {

  }

function drawCoins() {

function drawPlayer() {

function drawTitle(rdt) {
  const cx = W / 2, cy = H * 0.24, size = Math.min(84, W / 7.5);
  ['NEON', 'DASH'].forEach((word, ri) => {
    ctx.save();
    const intro = clamp((gtime - ri * 0.25) / 0.6, 0, 1), dx = (1 - ease.outBack(intro)) * (ri ? 1 : -1) * W;
    ctx.translate(cx + dx, cy + ri * size * 1.0);
    ctx.transform(1, 0, -0.25, 1, 0, 0); // 기울임 (속도감)
    try { ctx.letterSpacing = '6px'; } catch (e) {}
    ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center';
    // 스피드 줄무늬 그림자
    for (let i = 1; i <= 4; i++) { ctx.fillStyle = `rgba(${ri ? C.pink : C.cyan},${0.18 / i})`; ctx.fillText(word, -i * 14, 0); }
    const g = ctx.createLinearGradient(0, -size, 0, 0);
    g.addColorStop(0, '#fff'); g.addColorStop(1, ri ? `rgb(${C.pink})` : `rgb(${C.cyan})`);
    ctx.shadowColor = `rgba(${ri ? C.pink : C.cyan},0.9)`; ctx.shadowBlur = 24;
    ctx.fillStyle = g; ctx.fillText(word, 0, 0);
    ctx.restore();
  });
  // 데모 러너
  demo.phase += rdt * 430 / 34;
  const jumpT = (gtime % 2.4);
  demo.onGround = jumpT > 0.7; demo.vy = jumpT < 0.35 ? -1 : 1;
  const jy = demo.onGround ? 0 : -Math.sin(jumpT / 0.7 * Math.PI) * 120;
  if (Math.random() < 0.3 && demo.onGround) addDust(PX - 6, GY, rand(-260, -120), rand(-50, -10), rand(5, 9), 0.35);
  drawRunner(demo, PX, GY + jy, 1);
  const blink = 0.55 + 0.45 * Math.sin(gtime * 4);
  ctx.globalAlpha = blink;
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  txt('클릭 또는 SPACE 키로 시작', cx, H * 0.86, Math.min(20, W / 22), '#fff', 'center', 700, C.cyan, 14);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.globalAlpha = 1;
  const help = W < 560 ? ['탭: 점프 (공중에서 한 번 더)', '아래로 스와이프: 슬라이드'] : ['점프: SPACE / ↑ / 클릭 (2단 점프)     슬라이드: ↓ / S / 우클릭', '일시정지: P     소리: M'];
  help.forEach((h, i) => txt(h, cx, H * 0.91 + i * 20, 12, 'rgba(190,200,255,0.8)', 'center', 500));
  if (best > 0) txt(`BEST  ${best}`, cx, 34, 13, `rgb(${C.gold})`, 'center', 700, C.gold, 8);
}
function drawOver() {
  const k = Math.min(1, overT / 0.8);
  ctx.fillStyle = `rgba(7,3,26,${0.7 * k})`; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.28, size = Math.min(68, W / 8), s = lerp(1.6, 1, ease.outCubic(k));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.globalAlpha = k;
  const g = Math.random() < 0.08 ? rand(4, 12) : 2;
  ctx.globalCompositeOperation = 'lighter';
  txt('WIPEOUT', -g, 0, size, 'rgba(255,40,140,0.8)', 'center', 900); txt('WIPEOUT', g, 0, size, 'rgba(40,200,255,0.8)', 'center', 900);
  ctx.globalCompositeOperation = 'source-over'; txt('WIPEOUT', 0, 0, size, '#fff', 'center', 900);
  ctx.restore();
  const rows = [['SCORE', Math.round(score() * clamp((overT - 0.5) / 1, 0, 1))], ['거리', `${meters()} m`], ['코인', coinCount], ['파괴', smashed]];
  rows.forEach((r, i) => {
    const t = clamp((overT - 0.4 - i * 0.15) / 0.4, 0, 1); if (t <= 0) return;
    const x = cx + (1 - ease.outCubic(t)) * 120, y = cy + 70 + i * 36;
    ctx.globalAlpha = t;
    txt(r[0], x - 130, y, 14, 'rgba(190,200,255,0.8)'); txt(String(r[1]), x + 130, y, 20, '#fff', 'right', 900, C.cyan, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x - 130, y + 10, 260, 1); ctx.globalAlpha = 1;
  });
  if (newRecord && overT > 1.4) {
    ctx.save(); ctx.translate(cx, cy + 230); const s2 = 1 + Math.sin(gtime * 6) * 0.06; ctx.scale(s2, s2);
    txt('★ NEW RECORD ★', 0, 0, 22, `hsl(${(gtime * 200) % 360},100%,70%)`, 'center', 900, C.gold, 16); ctx.restore();
  }
  if (overT > 1) { ctx.globalAlpha = 0.55 + 0.45 * Math.sin(gtime * 4); txt('클릭 또는 SPACE 키로 다시 달리기', cx, cy + 280, 16, '#fff', 'center', 700, C.cyan, 10); ctx.globalAlpha = 1; }
}

/* ---------- 입력 ---------- */
const keys = {};
let touch = null;
addEventListener('keydown', e => {
  Snd.init();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  const first = !keys[e.code]; keys[e.code] = true;
  if (!first) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
    if (state === 'title' || (state === 'over' && overT > 1)) newGame(); else jump();
  } else if (e.code === 'ArrowDown' || e.code === 'KeyS') { if (player) player.holdDown = true; slide(); }
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
  else if (e.code === 'KeyM') Snd.muted = !Snd.muted;
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') releaseJump();
  if ((e.code === 'ArrowDown' || e.code === 'KeyS') && player) player.holdDown = false;
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') paused = true; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  Snd.init();
  if (state === 'title' || (state === 'over' && overT > 1)) { newGame(); return; }
  if (state !== 'play') return;
  if (paused) { paused = false; return; }
  if (e.pointerType === 'touch') { touch = { x: e.clientX, y: e.clientY, t: performance.now(), used: false }; return; }
  if (e.button === 2) slide(); else jump();
});
cv.addEventListener('pointermove', e => {
  if (!touch || touch.used) return;
  if (e.clientY - touch.y > 34) { touch.used = true; slide(); }
  else if (touch.y - e.clientY > 34) { touch.used = true; jump(); }
});
addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse' && e.button === 0) releaseJump();
  if (touch) { if (!touch.used) jump(); touch = null; }
});

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  const running = !(state === 'play' && paused);
  if (running) gtime += rdt;
  if ((state === 'play' || state === 'over') && running) {
    if (slowT > 0) slowT -= rdt; else timeScale += (1 - timeScale) * Math.min(1, rdt * 3);
    update(rdt * timeScale, rdt);
    if (state === 'over') overT += rdt;
  } else if (state === 'title') {
    worldX += rdt * 430; for (const l of layers) l.off = (l.off + rdt * 430 * l.sp) % l.LW;
    for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.life -= rdt; if (q.life <= 0) { parts.splice(i, 1); continue; } if (q.drag) { const d = Math.exp(-q.drag * rdt); q.vx *= d; q.vy *= d; } q.x += q.vx * rdt; q.y += q.vy * rdt; }
  }
  if (running) { shake *= Math.exp(-rdt * 8); flash = Math.max(0, flash - rdt * 2.5); }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  if (shake > 0.3) ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
  drawBackground();
  if (state === 'title') { drawParts(true); drawTitle(running ? rdt : 0); }
  else { drawCoins(); drawObstacles(); drawParts(true); drawPlayer(); drawParts(false); drawTexts(); drawSpeedLines(); }
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(${flashColor},${Math.min(0.8, flash)})`; ctx.fillRect(0, 0, W, H); }
  if (timeScale < 0.6 && state !== 'title') { ctx.fillStyle = `rgba(80,140,255,${(0.6 - timeScale) * 0.15})`; ctx.fillRect(0, 0, W, H); }
  ctx.drawImage(vignette, 0, 0, W, H);
  if (state === 'play') { drawHUD(); drawAnnounce(rdt); }
  if (state === 'over') drawOver();
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(7,3,26,0.6)'; ctx.fillRect(0, 0, W, H);
    txt('PAUSED', W / 2, H / 2, Math.min(56, W / 9), '#fff', 'center', 900, C.cyan, 20);
    txt('P 키 또는 클릭으로 계속', W / 2, H / 2 + 40, 14, 'rgba(190,200,255,0.85)', 'center', 700);
  }
  backLink.classList.toggle('hide', state === 'play' && !paused);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
