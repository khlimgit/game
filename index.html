<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nova Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="arcade.html" style="position:fixed;left:14px;bottom:12px;font:700 12px Orbitron,'Malgun Gothic',sans-serif;color:rgba(190,210,255,.8);text-decoration:none;padding:6px 10px;border:1px solid rgba(150,180,255,.35);border-radius:8px;background:rgba(10,8,30,.6);letter-spacing:1px;transition:opacity .3s">← 아케이드</a>
<script>
'use strict';
/* =========================================================
   NOVA STRIKE — 다이나믹 종스크롤 슈팅 게임
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, bgGrad = null, vignette = null;

const FONT = 'Orbitron, "Segoe UI", "Malgun Gothic", sans-serif';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
};
const C = {
  cyan: '80,220,255', blue: '90,140,255', pink: '255,60,160', red: '255,70,60', orange: '255,150,40',
  yellow: '255,220,90', green: '120,255,150', purple: '190,110,255', white: '255,255,255', gold: '255,210,80',
};

/* ---------- 리사이즈 / 사전 렌더 ---------- */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#060316'); bgGrad.addColorStop(0.55, '#0b0a2c'); bgGrad.addColorStop(1, '#170828');
  vignette = document.createElement('canvas');
  vignette.width = Math.max(1, W); vignette.height = Math.max(1, H);
  const vg = vignette.getContext('2d');
  const gr = vg.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.65)');
  vg.fillStyle = gr; vg.fillRect(0, 0, W, H);
}
addEventListener('resize', resize);

const glowCache = new Map();
function glowSprite(rgb) {
  let s = glowCache.get(rgb); if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.14, `rgba(${rgb},0.95)`);
  gr.addColorStop(0.42, `rgba(${rgb},0.28)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache.set(rgb, s); return s;
}
function drawGlow(x, y, size, rgb, alpha = 1) {
  if (size <= 0 || alpha <= 0) return;
  const a = ctx.globalAlpha; ctx.globalAlpha = a * alpha;
  ctx.drawImage(glowSprite(rgb), x - size / 2, y - size / 2, size, size);
  ctx.globalAlpha = a;
}
function makeNebula(rgb) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  for (let i = 0; i < 7; i++) {
    const x = 128 + rand(-55, 55), y = 128 + rand(-55, 55), r = rand(45, 115);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${rgb},0.32)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  }
  return c;
}
function makePlanet(r) {
  const hue = randi(0, 360), sz = Math.ceil(r * 3.2), c = document.createElement('canvas');
  c.width = c.height = sz; const g = c.getContext('2d'), cx = sz / 2, cy = sz / 2;
  const ring = Math.random() < 0.6;
  const drawRing = (front) => {
    g.save(); g.translate(cx, cy); g.rotate(-0.35); g.lineWidth = r * 0.12;
    g.strokeStyle = `hsla(${hue + 40},70%,70%,0.45)`;
    g.beginPath(); g.ellipse(0, 0, r * 1.5, r * 0.38, 0, front ? 0 : Math.PI, front ? Math.PI : TAU); g.stroke();
    g.restore();
  };
  if (ring) drawRing(false);
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.clip();
  const gr = g.createRadialGradient(cx - r * 0.4, cy - r * 0.4, r * 0.1, cx, cy, r);
  gr.addColorStop(0, `hsl(${hue},65%,62%)`); gr.addColorStop(1, `hsl(${hue + 30},60%,18%)`);
  g.fillStyle = gr; g.fillRect(0, 0, sz, sz);
  for (let i = 0; i < 7; i++) {
    g.fillStyle = `hsla(${hue + rand(-30, 30)},60%,${rand(30, 70)}%,0.18)`;
    g.fillRect(0, cy - r + rand(0, 2 * r), sz, rand(3, r * 0.25));
  }
  const sh = g.createRadialGradient(cx - r * 0.5, cy - r * 0.5, r * 0.6, cx, cy, r * 1.25);
  sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,10,0.85)');
  g.fillStyle = sh; g.fillRect(0, 0, sz, sz); g.restore();
  g.strokeStyle = `hsla(${hue},90%,75%,0.35)`; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, r, Math.PI * 0.9, Math.PI * 1.6); g.stroke();
  if (ring) drawRing(true);
  return c;
}

/* ---------- 사운드 (WebAudio 신스) ---------- */
const Snd = {
  ctx: null, master: null, muted: false, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const A = window.AudioContext || window.webkitAudioContext; this.ctx = new A();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.3; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok(key, gap) {
    if (!this.ctx || this.muted) return false;
    const n = this.ctx.currentTime;
    if (key) { if (this.last[key] && n - this.last[key] < gap) return false; this.last[key] = n; }
    return true;
  },
  tone(f, dur, type, vol, f2) {
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  burst(dur, vol, freq, f2) {
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t);
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur);
  },
  shoot() { if (this.ok('shoot', 0.07)) this.tone(1300, 0.05, 'square', 0.018, 600); },
  hit() { if (this.ok('hit', 0.05)) this.tone(240, 0.04, 'square', 0.025, 120); },
  boom(big) {
    if (!this.ok(big ? 'bigboom' : 'boom', big ? 0.1 : 0.05)) return;
    this.burst(big ? 1.3 : 0.45, big ? 0.7 : 0.32, big ? 2200 : 3200, 50);
    this.tone(big ? 90 : 160, big ? 0.9 : 0.3, 'sawtooth', big ? 0.2 : 0.07, 30);
  },
  power() { if (!this.ok()) return; [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.ok() && this.tone(f, 0.13, 'triangle', 0.09), i * 55)); },
  hurt() { if (!this.ok()) return; this.tone(420, 0.6, 'sawtooth', 0.16, 40); this.burst(0.6, 0.45, 1600, 80); },
  bomb() { if (!this.ok()) return; this.burst(1.8, 0.7, 5000, 40); this.tone(70, 1.4, 'sine', 0.5, 22); },
  warn() { if (!this.ok()) return; for (let i = 0; i < 4; i++) setTimeout(() => this.ok() && this.tone(440, 0.38, 'square', 0.05, 330), i * 700); },
  graze() { if (this.ok('graze', 0.06)) this.tone(2400, 0.03, 'sine', 0.025); },
  coin() { if (this.ok('coin', 0.04)) this.tone(1800, 0.05, 'triangle', 0.025, 2600); },
};

/* ---------- 상태 ---------- */
let state = 'title', paused = false;
let player, bullets = [], ebullets = [], enemies = [], parts = [], items = [], texts = [], timers = [], boss = null, bombWave = null;
let score = 0, dispScore = 0, hiScore = 0, combo = 0, comboT = 0, maxCombo = 0, kills = 0, comboPop = 0, scorePop = 0;
let wave = 1, formationsLeft = 0, spawnT = 0, waveDone = false, pending = 0;
let timeScale = 1, slowT = 0, freeze = 0, shake = 0, flash = 0, flashColor = C.white;
let warningT = 0, announce = null, bgSpeed = 1, gtime = 0, overT = 0, overDelay = -1, newRecord = false, usedTouch = false;
try { hiScore = +localStorage.getItem('novaStrikeHi') || 0; } catch (e) { hiScore = 0; }

const WAVE_SUBS = ['적 정찰 편대 출현', '편대 비행 감지', '적 주력 부대 접근', '고속 요격기 경보', '공중 회전포대 배치', '방어선을 돌파하라'];

function after(t, fn) { timers.push({ t, fn }); }
function later(t, fn) { pending++; after(t, () => { pending--; fn(); }); }
function slowmo(s, d) { timeScale = Math.min(timeScale, s); slowT = Math.max(slowT, d); }
function addShake(v) { shake = Math.max(shake, v); }
function doFlash(a, rgb = C.white) { flash = Math.max(flash, a); flashColor = rgb; }
function showAnnounce(title, sub, rgb = C.cyan) { announce = { title, sub, rgb, t: 0, dur: 2.6 }; }

/* ---------- 파티클 ---------- */
function P(o) { if (parts.length < 3200) parts.push(o); }
function addGlow(x, y, vx, vy, size, rgb, life, drag = 0, grow = 1) { P({ k: 0, x, y, vx, vy, size, rgb, life, max: life, drag, grow }); }
function addSpark(x, y, vx, vy, rgb, life, w = 2, drag = 2) { P({ k: 1, x, y, vx, vy, rgb, life, max: life, w, drag }); }
function addRing(x, y, r1, r2, rgb, life, w = 4) { P({ k: 2, x, y, vx: 0, vy: 0, r1, r2, rgb, life, max: life, w }); }
function addDebris(x, y, vx, vy, col, life, sz) { P({ k: 3, x, y, vx, vy, col, life, max: life, sz, rot: rand(0, TAU), vr: rand(-14, 14), g: 260, drag: 0.6 }); }
function addSmoke(x, y, vx, vy, size, life) { P({ k: 4, x, y, vx, vy, size, life, max: life, drag: 1.5 }); }
function addText(x, y, str, s = 18, rgb = C.white, life = 0.9) { texts.push({ x, y, str, s, rgb, life, max: life }); }

function explode(x, y, s, rgb) {
  addGlow(x, y, 0, 0, 140 * s, '255,235,190', 0.28, 0, 1.6);
  addRing(x, y, 8 * s, 95 * s, rgb, 0.5, 7 * s);
  addRing(x, y, 4 * s, 55 * s, '255,240,200', 0.3, 3 * s);
  for (let i = 0; i < 14 * s; i++) {
    const a = rand(0, TAU), sp = rand(30, 280) * s;
    addGlow(x, y, Math.cos(a) * sp, Math.sin(a) * sp + 40, rand(22, 55) * Math.sqrt(s), i % 3 ? '255,140,40' : rgb, rand(0.35, 0.85), 3.2, 0.4);
  }
  for (let i = 0; i < 22 * s; i++) {
    const a = rand(0, TAU), sp = rand(300, 1000) * Math.sqrt(s);
    addSpark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, i % 2 ? '255,230,160' : rgb, rand(0.25, 0.6), rand(1.5, 3), 3);
  }
  for (let i = 0; i < 6 * s; i++) {
    const a = rand(0, TAU), sp = rand(80, 320);
    addDebris(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 60, `rgb(${rgb})`, rand(0.6, 1.3), rand(2, 6));
  }
  for (let i = 0; i < 5 * s; i++) addSmoke(x + rand(-12, 12) * s, y + rand(-12, 12) * s, rand(-40, 40), rand(20, 80), rand(18, 34) * s, rand(0.9, 1.7));
  addShake(5 * s);
}

/* ---------- 입력 ---------- */
const keys = {};
const pointer = { active: false, x: 0, y: 0, touch: false, down: false, lx: 0, ly: 0 };
addEventListener('keydown', e => {
  Snd.init();
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && (state === 'title' || (state === 'over' && overT > 1.2))) newGame();
  else if (e.code === 'KeyX' || e.code === 'KeyB' || e.code === 'ShiftLeft') useBomb();
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
  else if (e.code === 'KeyM') Snd.muted = !Snd.muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') paused = true; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  Snd.init();
  pointer.touch = e.pointerType === 'touch'; if (pointer.touch) usedTouch = true;
  pointer.x = pointer.lx = e.clientX; pointer.y = pointer.ly = e.clientY; pointer.down = true; pointer.active = true;
  if (state === 'title' || (state === 'over' && overT > 1.2)) { newGame(); return; }
  if (state !== 'play') return;
  if (paused) { paused = false; return; }
  if (e.button === 2) { useBomb(); return; }
  if (pointer.touch && Math.hypot(e.clientX - (W - 62), e.clientY - (H - 70)) < 44) useBomb();
});
cv.addEventListener('pointermove', e => {
  pointer.touch = e.pointerType === 'touch';
  if (pointer.touch && pointer.down && state === 'play' && player && !player.dead && player.respawn <= 0 && !paused) {
    player.x += (e.clientX - pointer.lx) * 1.25; player.y += (e.clientY - pointer.ly) * 1.25;
  }
  pointer.lx = pointer.x = e.clientX; pointer.ly = pointer.y = e.clientY; pointer.active = true;
});
addEventListener('pointerup', () => { pointer.down = false; });

/* ---------- 배경 ---------- */
let stars = [], nebs = [], planet = null;
function initBg() {
  stars = []; for (let i = 0; i < 260; i++) stars.push({ x: Math.random(), y: Math.random(), z: Math.random() });
  const cols = [C.purple, C.blue, C.pink, '60,120,200', '140,60,220'];
  nebs = []; for (let i = 0; i < 5; i++) nebs.push({ spr: makeNebula(cols[i % cols.length]), x: Math.random(), y: rand(-0.5, 1), size: rand(500, 900), sp: rand(10, 22) });
  newPlanet(true);
}
function newPlanet(first) {
  const r = rand(40, 110);
  planet = { spr: makePlanet(r), r, x: rand(0.1, 0.9), y: first ? rand(-0.1, 0.4) * H : -r * 2 - rand(100, 600), sp: rand(14, 26) };
}
function drawBackground(dt) {
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  const camX = player && state !== 'title' ? (player.x - W / 2) : Math.sin(gtime * 0.4) * W * 0.2;
  ctx.globalCompositeOperation = 'lighter';
  for (const n of nebs) {
    n.y += n.sp * bgSpeed * dt / H;
    if (n.y * H - n.size / 2 > H) { n.y = (-n.size / 2 - rand(0, 400)) / H; n.x = Math.random(); }
    ctx.globalAlpha = 0.55;
    ctx.drawImage(n.spr, n.x * W - camX * 0.02 - n.size / 2, n.y * H - n.size / 2, n.size, n.size);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  planet.y += planet.sp * bgSpeed * dt;
  const ps = planet.spr.width;
  if (planet.y - ps / 2 > H) newPlanet(false);
  ctx.drawImage(planet.spr, planet.x * W - camX * 0.04 - ps / 2, planet.y - ps / 2);

  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    const sp = (18 + s.z * s.z * 520) * bgSpeed;
    s.y += sp * dt / H;
    if (s.y > 1.02) { s.y -= 1.04; s.x = Math.random(); }
    let x = ((s.x * W - camX * s.z * 0.12) % W + W) % W, y = s.y * H;
    const a = 0.25 + s.z * 0.75;
    if (s.z > 0.68) {
      const len = Math.max(2, sp * 0.035 * Math.min(bgSpeed, 4));
      ctx.strokeStyle = `rgba(170,210,255,${a})`; ctx.lineWidth = 0.8 + s.z * 1.4;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - len); ctx.stroke();
    } else {
      ctx.fillStyle = `rgba(200,210,255,${a})`;
      const sz = 0.6 + s.z * 1.6; ctx.fillRect(x, y, sz, sz);
    }
  }
  if (bgSpeed > 1.6) {
    const k = Math.min(1, (bgSpeed - 1.6) / 2);
    for (let i = 0; i < 6; i++) {
      const x = Math.random() * W, y = Math.random() * H, l = rand(80, 260) * k;
      ctx.strokeStyle = `rgba(150,200,255,${0.25 * k})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + l); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- 게임 시작 / 웨이브 ---------- */
function newGame() {
  player = { x: W / 2, y: H + 80, tilt: 0, fireT: 0, missileT: 0, power: 1, lives: 2, bombs: 3, shield: 0, inv: 3, respawn: 1.3, dead: false, muzzle: 0, shieldPop: 0 };
  bullets = []; ebullets = []; enemies = []; parts = []; items = []; texts = []; timers = []; boss = null; bombWave = null;
  score = 0; dispScore = 0; combo = 0; comboT = 0; maxCombo = 0; kills = 0; comboPop = 0; scorePop = 0; pending = 0;
  timeScale = 1; slowT = 0; freeze = 0; shake = 0; flash = 0; warningT = 0; announce = null; overDelay = -1; overT = 0; newRecord = false;
  paused = false; state = 'play';
  startWave(1);
}
function startWave(n) {
  wave = n; waveDone = false;
  if (n % 3 === 0) {
    formationsLeft = 0; warningT = 3.2; Snd.warn();
    later(3.2, spawnBoss);
  } else {
    formationsLeft = 5 + n * 2; spawnT = 2.4;
    showAnnounce(`WAVE ${n}`, WAVE_SUBS[(n - 1) % WAVE_SUBS.length]);
  }
}
const ETYPES = {
  drone: { hp: 3, r: 16, score: 100, rgb: C.pink },
  diver: { hp: 5, r: 16, score: 150, rgb: C.orange },
  gunship: { hp: 34, r: 34, score: 700, rgb: C.purple },
  spinner: { hp: 18, r: 24, score: 450, rgb: C.green },
};
function spawnEnemy(type, x, y, o = {}) {
  const d = ETYPES[type], hs = 1 + (wave - 1) * 0.15;
  const e = Object.assign({ type, x, y, vx: 0, vy: 0, t: 0, flash: 0, hp: Math.ceil(d.hp * hs), r: d.r, score: d.score, rgb: d.rgb,
    shootT: rand(0.8, 2.2), rot: 0, amp: 40, freq: 2, phase: rand(0, TAU), speed: 150, phase2: 0, cycle: 0 }, o);
  if (e.bx === undefined) e.bx = x;
  e.maxHp = e.hp; enemies.push(e); return e;
}
function spawnFormation() {
  const opts = ['line', 'snake', 'vee', 'divers'];
  if (wave >= 2) opts.push('gunship', 'divers', 'snake');
  if (wave >= 4) opts.push('spinner', 'gunship');
  if (wave >= 5) opts.push('spinner', 'vee');
  const f = opts[randi(0, opts.length - 1)];
  const sp = 1 + Math.min(0.6, wave * 0.04);
  if (f === 'line') {
    const n = 5 + Math.min(4, wave >> 1);
    for (let i = 0; i < n; i++) spawnEnemy('drone', W * (i + 1) / (n + 1), -30, { amp: 30, speed: 130 * sp, phase: i * 0.6 });
  } else if (f === 'vee') {
    const cx = rand(W * 0.3, W * 0.7);
    for (let i = 0; i < 7; i++) { const o = i - 3; spawnEnemy('drone', cx + o * Math.min(44, W / 12), -30 - Math.abs(o) * 34, { amp: 18, freq: 2, phase: 0, speed: 165 * sp }); }
  } else if (f === 'snake') {
    const bx = rand(W * 0.3, W * 0.7), amp = Math.min(W * 0.28, 190), fr = rand(1.8, 2.6);
    for (let i = 0; i < 9; i++) later(i * 0.16, () => spawnEnemy('drone', bx, -30, { bx, amp, freq: fr, phase: 0, speed: 175 * sp }));
  } else if (f === 'divers') {

      drawGlow(it.x, it.y, 14 + Math.sin(gtime * 20 + it.x) * 3, C.gold, 0.9);
      ctx.globalCompositeOperation = 'source-over';
      continue;
    }
    const rgb = ITEM_RGB[it.type], s = 1 + Math.sin(it.t * 6) * 0.1;
    ctx.save(); ctx.translate(it.x, it.y); ctx.scale(s, s);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(0, 0, 70, rgb, 0.5 + Math.sin(it.t * 8) * 0.2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.rotate(it.t * 2);
    ctx.fillStyle = 'rgba(10,10,30,0.85)'; ctx.strokeStyle = `rgb(${rgb})`; ctx.lineWidth = 2.5;
    ctx.beginPath(); for (let i = 0; i <= 6; i++) { const a = i / 6 * TAU; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * 15, Math.sin(a) * 15); } ctx.fill(); ctx.stroke();
    ctx.rotate(-it.t * 2);
    ctx.fillStyle = '#fff'; ctx.font = `900 15px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(it.type, 0, 1);
    ctx.restore();
  }
}
function drawParts(normal) {
  if (normal) {
    for (const p of parts) {
      const k = p.life / p.max;
      if (p.k === 4) {
        ctx.fillStyle = `rgba(80,70,105,${k * 0.32})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + (1 - k) * 1.1), 0, TAU); ctx.fill();
      } else if (p.k === 3) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, k * 2);
        ctx.fillStyle = p.col; ctx.fillRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2);
        ctx.restore();
      }
    }
    return;
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const k = p.life / p.max;
    if (p.k === 0) drawGlow(p.x, p.y, p.size * lerp(p.grow, 1, k), p.rgb, k);
    else if (p.k === 1) {
      ctx.strokeStyle = `rgba(${p.rgb},${k})`; ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
    } else if (p.k === 2) {
      const r = lerp(p.r1, p.r2, ease.outCubic(1 - k));
      ctx.strokeStyle = `rgba(${p.rgb},${k})`; ctx.lineWidth = Math.max(0.5, p.w * k);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const age = t.max - t.life, k = t.life / t.max;
    const s = age < 0.18 ? ease.outBack(age / 0.18) : 1;
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(s, s);
    ctx.globalAlpha = Math.min(1, k * 3);
    ctx.font = `900 ${t.s}px ${FONT}`;
    ctx.shadowColor = `rgba(${t.rgb},0.9)`; ctx.shadowBlur = 12;
    ctx.fillStyle = `rgb(${t.rgb})`; ctx.fillText(t.str, 0, 0);
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillText(t.str, 0, -1);
    ctx.restore();
  }
}
function drawBombWave() {
  const bw = bombWave; if (!bw) return;
  ctx.globalCompositeOperation = 'lighter';
  const k = Math.max(0, 1 - bw.t / 1.0);
  for (let i = 0; i < 3; i++) {
    const r = Math.max(0, bw.r - i * 50);
    ctx.strokeStyle = `rgba(${i === 1 ? C.pink : C.white},${0.7 * k + 0.2})`; ctx.lineWidth = 14 - i * 4;
    ctx.beginPath(); ctx.arc(bw.x, bw.y, r, 0, TAU); ctx.stroke();
  }
  const g = ctx.createRadialGradient(bw.x, bw.y, Math.max(0, bw.r * 0.6), bw.x, bw.y, Math.max(1, bw.r));
  g.addColorStop(0, 'rgba(255,80,200,0)'); g.addColorStop(1, `rgba(255,80,200,${0.25 * k})`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bw.x, bw.y, bw.r, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- HUD / 오버레이 ---------- */
function txt(str, x, y, size, color, align = 'left', weight = 700, glowRgb = null, blur = 10) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (glowRgb) { ctx.shadowColor = `rgba(${glowRgb},0.9)`; ctx.shadowBlur = blur; }
  ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.shadowBlur = 0;
}
function drawHUD(rdt) {
  const p = player;
  scorePop = Math.max(0, scorePop - rdt * 4); comboPop = Math.max(0, comboPop - rdt * 4);
  // 점수
  txt('SCORE', 20, 30, 11, 'rgba(160,200,255,0.8)', 'left', 700);
  ctx.save(); ctx.translate(20, 60); ctx.scale(1 + scorePop * 0.12, 1 + scorePop * 0.12);
  txt(String(Math.round(dispScore)).padStart(8, '0'), 0, 0, 26, '#fff', 'left', 900, C.cyan, 14);
  ctx.restore();
  txt(`HI ${String(Math.max(hiScore, score)).padStart(8, '0')}`, 20, 80, 11, 'rgba(255,210,120,0.85)', 'left', 700);
  // 웨이브
  if (!boss) txt(`WAVE ${wave}`, W / 2, 30, 13, 'rgba(180,210,255,0.85)', 'center', 700, C.blue, 8);
  // 생명 / 폭탄
  for (let i = 0; i < Math.max(0, p.lives); i++) drawShip(W - 26 - i * 30, 32, 0, gtime, 0.5, 0.95);
  for (let i = 0; i < p.bombs; i++) {
    const x = W - 24 - i * 24, y = 66;
    ctx.globalCompositeOperation = 'lighter'; drawGlow(x, y, 26, C.pink, 0.6); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#2a0b22'; ctx.strokeStyle = `rgb(${C.pink})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 8, 0, TAU); ctx.fill(); ctx.stroke();
    txt('B', x, y + 4, 9, '#fff', 'center', 900);
  }
  // 파워 게이지
  const bx = 20, by = H - 26;
  txt('POWER', bx, by - 12, 10, 'rgba(160,200,255,0.8)', 'left', 700);
  for (let i = 0; i < 5; i++) {
    const on = i < p.power, x = bx + i * 26;
    ctx.fillStyle = on ? `rgba(${C.orange},${0.75 + 0.25 * Math.sin(gtime * 6 - i)})` : 'rgba(255,255,255,0.1)';
    ctx.beginPath(); ctx.moveTo(x + 4, by); ctx.lineTo(x + 24, by); ctx.lineTo(x + 20, by + 10); ctx.lineTo(x, by + 10); ctx.closePath(); ctx.fill();
    if (on) { ctx.globalCompositeOperation = 'lighter'; drawGlow(x + 12, by + 5, 30, C.orange, 0.35); ctx.globalCompositeOperation = 'source-over'; }
  }
  // 콤보
  if (combo >= 2) {
    const mult = Math.min(8, 1 + Math.floor(combo / 8) * 0.5);
    const s = 1 + comboPop * 0.35;
    ctx.save(); ctx.translate(W - 20, H * 0.32); ctx.scale(s, s);
    txt(`${combo}`, 0, 0, 38, '#fff', 'right', 900, C.gold, 16);
    txt('COMBO', 0, 18, 12, `rgb(${C.gold})`, 'right', 700);
    if (mult > 1) txt(`x${mult.toFixed(1)}`, 0, 38, 16, `rgb(${C.orange})`, 'right', 900, C.orange, 8);
    ctx.restore();
    const w = 90 * clamp(comboT / 2.2, 0, 1);
    ctx.fillStyle = `rgba(${C.gold},0.8)`; ctx.fillRect(W - 20 - w, H * 0.32 + 48, w, 3);
  }
  // 보스 체력
  if (boss && !boss.dying) {
    const wide = W >= 640, y = wide ? 22 : 104;
    const b = boss, bw = (wide ? Math.min(460, W - 300) : W - 40) * ease.outCubic(b.bar), x = W / 2 - bw / 2;
    txt(`MOTHERSHIP Mk.${b.lvl}`, W / 2, y - 6 + 0, 10, b.rage ? `rgb(${C.red})` : 'rgba(220,190,255,0.9)', 'center', 700);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x - 2, y - 2, bw + 4, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(x, y, bw * (b.ghost / b.maxHp), 8);
    const g = ctx.createLinearGradient(x, 0, x + bw, 0);
    g.addColorStop(0, b.rage ? '#ff2a4a' : '#8a4dff'); g.addColorStop(1, b.rage ? '#ff9a3a' : '#ff4fd0');
    ctx.fillStyle = g; ctx.fillRect(x, y, bw * (b.hp / b.maxHp), 8);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; for (let i = 1; i < 20; i++) ctx.fillRect(x + bw * i / 20, y, 1, 8);
    ctx.globalCompositeOperation = 'lighter'; drawGlow(x + bw * (b.hp / b.maxHp), y + 4, 40, b.rage ? C.red : C.pink, 0.8); ctx.globalCompositeOperation = 'source-over';
  }
  // 모바일 폭탄 버튼
  if (usedTouch) {
    const x = W - 62, y = H - 70, ready = p.bombs > 0 && !bombWave;
    ctx.fillStyle = ready ? 'rgba(255,60,160,0.22)' : 'rgba(255,255,255,0.06)';
    ctx.strokeStyle = ready ? `rgba(${C.pink},0.9)` : 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 34 + (ready ? Math.sin(gtime * 4) * 2 : 0), 0, TAU); ctx.fill(); ctx.stroke();
    txt('BOMB', x, y + 5, 12, '#fff', 'center', 900);
  }
}
function drawAnnounce(rdt) {
  const a = announce; if (!a) return;
  if (!paused) a.t += rdt;
  const p = a.t / a.dur; if (p >= 1) { announce = null; return; }
  let alpha = 1, sc = 1, spread = 0;
  if (p < 0.14) { const k = p / 0.14; sc = lerp(2.6, 1, ease.outCubic(k)); alpha = k; }
  else if (p > 0.8) { const k = (p - 0.8) / 0.2; alpha = 1 - k; spread = k * 40; sc = 1 + k * 0.15; }
  const y = H * 0.38;
  ctx.save();
  ctx.globalAlpha = alpha;
  const lw = Math.min(W * 0.42, 340) * ease.outCubic(Math.min(1, p / 0.3)) * (p > 0.8 ? 1 - (p - 0.8) / 0.2 : 1);
  ctx.fillStyle = `rgba(${a.rgb},0.9)`;
  ctx.fillRect(W / 2 - lw, y - 52, lw * 2, 2); ctx.fillRect(W / 2 - lw, y + 26, lw * 2, 2);
  ctx.fillStyle = `rgba(${a.rgb},0.08)`; ctx.fillRect(W / 2 - lw, y - 50, lw * 2, 76);
  ctx.translate(W / 2, y); ctx.scale(sc, sc);
  try { ctx.letterSpacing = `${6 + spread}px`; } catch (e) {}
  const size = Math.min(54, W / 11);
  txt(a.title, 0, 0, size, '#fff', 'center', 900, a.rgb, 24);
  try { ctx.letterSpacing = `${3 + spread / 3}px`; } catch (e) {}
  txt(a.sub, 0, 50, 15, `rgba(${a.rgb},1)`, 'center', 700);
  ctx.restore();
}
function drawWarning() {
  if (warningT <= 0) return;
  const a = 0.5 + 0.5 * Math.sin(gtime * 10), fade = Math.min(1, warningT / 0.4, (3.2 - warningT) / 0.3);
  ctx.save(); ctx.globalAlpha = Math.max(0, fade);
  ctx.fillStyle = `rgba(255,0,40,${0.06 + 0.1 * a})`; ctx.fillRect(0, 0, W, H);
  const cy = H * 0.4;
  for (const [yy, dir] of [[cy - 90, 1], [cy + 58, -1]]) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, yy, W, 30); ctx.clip();
    ctx.fillStyle = 'rgba(40,0,8,0.85)'; ctx.fillRect(0, yy, W, 30);
    ctx.fillStyle = 'rgba(255,40,60,0.9)';
    const off = (gtime * 160 * dir) % 60;
    for (let x = -80 + off; x < W + 80; x += 60) { ctx.beginPath(); ctx.moveTo(x, yy + 30); ctx.lineTo(x + 30, yy); ctx.lineTo(x + 50, yy); ctx.lineTo(x + 20, yy + 30); ctx.fill(); }
    ctx.restore();
  }
  const sz = Math.min(80, W / 7);
  try { ctx.letterSpacing = '10px'; } catch (e) {}
  ctx.globalAlpha = Math.max(0, fade) * (0.6 + 0.4 * a);
  txt('WARNING', W / 2, cy + 22, sz, '#ff3355', 'center', 900, C.red, 30);
  try { ctx.letterSpacing = '4px'; } catch (e) {}
  txt('거대 적 함선 접근 중', W / 2, cy + 50, 14, '#ffc0c8', 'center', 700);
  ctx.restore();
}
function drawTitle() {
  const cx = W / 2, cy = H * 0.32, size = Math.min(92, W / 6.2);
  // 뒤쪽 광선
  ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(TAU / 12);
    const g = ctx.createLinearGradient(0, 0, 0, -Math.max(W, H));
    g.addColorStop(0, 'rgba(120,120,255,0.12)'); g.addColorStop(1, 'rgba(120,120,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-30, -Math.max(W, H)); ctx.lineTo(30, -Math.max(W, H)); ctx.fill();
  }
  ctx.restore();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(gtime * 0.08); ctx.restore();
  const rows = [['N', 'O', 'V', 'A'], ['S', 'T', 'R', 'I', 'K', 'E']];
  rows.forEach((row, ri) => {
    const s = ri === 0 ? size : size * 0.72;
    ctx.font = `900 ${s}px ${FONT}`;
    const gap = s * 0.08;
    const widths = row.map(ch => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + gap * (row.length - 1);
    let x = cx - total / 2;
    row.forEach((ch, i) => {
      const intro = clamp((gtime - 0.15 * (i + ri * 4)) / 0.6, 0, 1);
      const yy = cy + (ri === 0 ? -s * 0.15 : s * 0.95) + Math.sin(gtime * 3 + i * 0.6 + ri) * 5 - (1 - ease.outBack(intro)) * 60;
      ctx.save(); ctx.globalAlpha = intro;
      const g = ctx.createLinearGradient(0, yy - s, 0, yy);
      g.addColorStop(0, ri === 0 ? '#ffffff' : '#ffd6f5'); g.addColorStop(1, ri === 0 ? '#4fd6ff' : '#ff4fb0');
      ctx.shadowColor = ri === 0 ? 'rgba(80,200,255,0.9)' : 'rgba(255,70,170,0.9)'; ctx.shadowBlur = 26;
      ctx.font = `900 ${s}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = g; ctx.fillText(ch, x, yy);
      ctx.restore();
      x += widths[i] + gap;
    });
  });
  // 호버링 기체
  const sy = H * 0.66 + Math.sin(gtime * 2) * 10, sx = cx + Math.sin(gtime * 0.9) * 40;
  const tilt = Math.cos(gtime * 0.9) * 0.35;
  addGlow(sx + rand(-6, 6), sy + 24, rand(-20, 20), rand(200, 300), rand(12, 18), C.cyan, 0.3, 0, 0.3);
  ctx.globalCompositeOperation = 'lighter'; drawGlow(sx, sy, 180, C.blue, 0.25); ctx.globalCompositeOperation = 'source-over';
  drawShip(sx, sy, tilt, gtime, 1.8, 1, 8);
  // 안내
  const blink = 0.55 + 0.45 * Math.sin(gtime * 4);
  ctx.globalAlpha = blink;
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  txt('클릭 또는 SPACE 키로 출격', cx, H * 0.83, Math.min(20, W / 22), '#fff', 'center', 700, C.cyan, 14);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.globalAlpha = 1;
  const help = W < 560
    ? ['드래그: 이동 · 자동 사격', 'BOMB 버튼: 화면 전체 폭탄']
    : ['이동: 마우스 / 방향키 · WASD     사격: 자동', '폭탄: 우클릭 / X     일시정지: P     소리: M'];
  help.forEach((h, i) => txt(h, cx, H * 0.89 + i * 20, 12, 'rgba(180,200,255,0.75)', 'center', 500));
  if (hiScore > 0) txt(`HI-SCORE  ${hiScore}`, cx, 34, 13, `rgb(${C.gold})`, 'center', 700, C.gold, 8);
}
function drawOver() {
  const k = Math.min(1, overT / 0.8);
  ctx.fillStyle = `rgba(5,2,15,${0.68 * k})`; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.3, size = Math.min(72, W / 8);
  const s = lerp(1.6, 1, ease.outCubic(k));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.globalAlpha = k;
  const g = Math.random() < 0.08 ? rand(4, 12) : 2;
  ctx.globalCompositeOperation = 'lighter';
  txt('GAME OVER', -g, 0, size, 'rgba(255,40,80,0.8)', 'center', 900);
  txt('GAME OVER', g, 0, size, 'rgba(40,200,255,0.8)', 'center', 900);
  ctx.globalCompositeOperation = 'source-over';
  txt('GAME OVER', 0, 0, size, '#fff', 'center', 900);
  ctx.restore();
  const rows = [['SCORE', Math.round(score * clamp((overT - 0.5) / 1.0, 0, 1))], ['WAVE', wave], ['MAX COMBO', maxCombo], ['격추 수', kills]];
  rows.forEach((r, i) => {
    const t = clamp((overT - 0.4 - i * 0.15) / 0.4, 0, 1); if (t <= 0) return;
    const x = cx + (1 - ease.outCubic(t)) * 120, y = cy + 70 + i * 36;
    ctx.globalAlpha = t;
    txt(r[0], x - 130, y, 14, 'rgba(180,200,255,0.8)', 'left', 700);
    txt(String(r[1]), x + 130, y, 20, '#fff', 'right', 900, C.cyan, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x - 130, y + 10, 260, 1);
    ctx.globalAlpha = 1;
  });
  if (newRecord && overT > 1.4) {
    const s2 = 1 + Math.sin(gtime * 6) * 0.06;
    ctx.save(); ctx.translate(cx, cy + 230); ctx.scale(s2, s2);
    txt('★ NEW RECORD ★', 0, 0, 22, `hsl(${(gtime * 200) % 360},100%,70%)`, 'center', 900, C.gold, 16);
    ctx.restore();
  }
  if (overT > 1.2) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(gtime * 4);
    txt('클릭 또는 SPACE 키로 재출격', cx, cy + 280, 16, '#fff', 'center', 700, C.cyan, 10);
    ctx.globalAlpha = 1;
  }
}

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  const running = !(state === 'play' && paused);
  if (running) gtime += rdt;
  let dt = 0;
  if (state === 'play' || state === 'over') {
    if (running) {
      if (slowT > 0) slowT -= rdt; else timeScale += (1 - timeScale) * Math.min(1, rdt * 3);
      if (freeze > 0) freeze -= rdt;
      else { dt = rdt * timeScale; update(dt, rdt); }
    }
    if (state === 'over') overT += rdt;
  } else {
    dt = rdt; updateParts(dt);
  }
  // 배경 속도
  const targetBg = warningT > 0 ? 4 : (boss && boss.enter ? 2.2 : (player && player.respawn > 0 && state === 'play' ? 2 : 1));
  bgSpeed += (targetBg - bgSpeed) * Math.min(1, rdt * 2);
  if (running) { shake *= Math.exp(-rdt * 7); flash = Math.max(0, flash - rdt * 2.2); }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBackground(running ? rdt * (state === 'title' ? 1 : timeScale) : 0);
  ctx.save();
  if (shake > 0.3) ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
  if (state === 'title') {
    drawParts(false);
    ctx.restore();
    drawTitle();
  } else {
    drawParts(true);
    drawItems();
    for (const e of enemies) drawEnemy(e);
    drawBoss();
    drawPlayer();
    drawBullets();
    drawParts(false);
    drawBombWave();
    drawTexts();
    ctx.restore();
  }
  if (flash > 0) { ctx.fillStyle = `rgba(${flashColor},${Math.min(0.85, flash)})`; ctx.fillRect(0, 0, W, H); }
  if (timeScale < 0.6 && state !== 'title') {
    ctx.fillStyle = `rgba(80,140,255,${(0.6 - timeScale) * 0.15})`; ctx.fillRect(0, 0, W, H);
  }
  ctx.drawImage(vignette, 0, 0, W, H);
  if (state === 'play' || state === 'over') {
    drawWarning();
    if (state === 'play') drawAnnounce(rdt);
    if (state === 'play') drawHUD(running ? rdt : 0);
    if (state === 'over') drawOver();
    if (paused && state === 'play') {
      ctx.fillStyle = 'rgba(5,2,15,0.6)'; ctx.fillRect(0, 0, W, H);
      try { ctx.letterSpacing = '8px'; } catch (e) {}
      txt('PAUSED', W / 2, H / 2, Math.min(56, W / 9), '#fff', 'center', 900, C.cyan, 20);
      try { ctx.letterSpacing = '2px'; } catch (e) {}
      txt('P 키 또는 클릭으로 계속', W / 2, H / 2 + 40, 14, 'rgba(180,200,255,0.85)', 'center', 700);
      try { ctx.letterSpacing = '0px'; } catch (e) {}
    }
  }
  cv.style.cursor = state === 'play' && !paused ? 'none' : 'default';
  const back = document.getElementById('back'), hideBack = state === 'play' && !paused;
  back.style.opacity = hideBack ? '0' : '1'; back.style.pointerEvents = hideBack ? 'none' : 'auto';
  requestAnimationFrame(frame);
}

resize(); initBg();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
