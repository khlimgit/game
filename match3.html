<script>
'use strict';
/* =========================================================
   GEM CASCADE — 보석 맞추기 퍼즐
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const FONT = 'Orbitron, "Segoe UI", "Malgun Gothic", sans-serif';
const TAU = Math.PI * 2, N = 8, NCOL = 6;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
function hslRgb(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return `${f(0)},${f(8)},${f(4)}`;
}
const C = { cyan: '80,220,255', pink: '255,60,160', red: '255,70,70', orange: '255,150,40', gold: '255,210,80', green: '120,255,150', purple: '190,110,255', white: '255,255,255' };
const HUES = [350, 28, 52, 140, 200, 280];
const GRGB = HUES.map(h => hslRgb(h, 0.95, 0.6));

/* ---------- 레이아웃 / 사전 렌더 ---------- */
let S = 0, CS = 0, BX = 0, BY = 0, gemSprites = [];
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  S = Math.floor(Math.min(W - 20, H - 170, 600)); CS = S / N;
  BX = (W - S) / 2; BY = Math.max(130, (H - S) / 2 + 45);
  if (BY + S > H - 10) BY = H - 10 - S;
  gemSprites = HUES.map((h, i) => makeGemSprite(i, h));
}
addEventListener('resize', resize);
function gemPath(g, t, R) {
  g.beginPath();
  const poly = (n, r, rot) => { for (let i = 0; i < n; i++) { const a = rot + i / n * TAU; g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); };
  switch (t) {
    case 0: poly(8, R * 0.95, Math.PI / 8); break;
    case 1: g.moveTo(0, -R); g.lineTo(R * 0.85, 0); g.lineTo(0, R); g.lineTo(-R * 0.85, 0); g.closePath(); break;
    case 2: g.moveTo(0, -R); g.lineTo(R * 0.98, R * 0.72); g.lineTo(-R * 0.98, R * 0.72); g.closePath(); break;
    case 3: poly(6, R * 0.95, 0); break;
    case 4: { const s = R * 0.8, r = R * 0.3; g.moveTo(-s + r, -s); g.arcTo(s, -s, s, s, r); g.arcTo(s, s, -s, s, r); g.arcTo(-s, s, -s, -s, r); g.arcTo(-s, -s, s, -s, r); g.closePath(); break; }
    case 5: for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU, r = i % 2 ? R * 0.5 : R; g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); break;
  }
}
function makeGemSprite(t, hue) {
  const px = Math.max(8, Math.round(CS * DPR)), c = document.createElement('canvas');
  c.width = c.height = px; const g = c.getContext('2d'), R = px * 0.4;
  g.translate(px / 2, px / 2);
  const gr = g.createRadialGradient(-R * 0.3, -R * 0.4, R * 0.05, 0, 0, R * 1.1);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.25, `hsl(${hue},100%,80%)`); gr.addColorStop(0.65, `hsl(${hue},95%,55%)`); gr.addColorStop(1, `hsl(${hue},90%,24%)`);
  gemPath(g, t, R); g.fillStyle = gr; g.fill();
  g.lineWidth = Math.max(1, px * 0.025); g.strokeStyle = `hsl(${hue},90%,20%)`; g.stroke();
  g.save(); g.scale(0.55, 0.55); gemPath(g, t, R); g.restore();
  g.fillStyle = 'rgba(255,255,255,0.16)'; g.fill(); g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = Math.max(1, px * 0.015); g.stroke();
  g.save(); g.rotate(-0.5); g.fillStyle = 'rgba(255,255,255,0.75)'; g.beginPath(); g.ellipse(-R * 0.1, -R * 0.5, R * 0.3, R * 0.12, 0, 0, TAU); g.fill(); g.restore();
  return c;
}
const glowCache = new Map();
function glowSprite(rgb) {
  let s = glowCache.get(rgb); if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.14, `rgba(${rgb},0.95)`);
  gr.addColorStop(0.42, `rgba(${rgb},0.28)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache.set(rgb, s); return s;
}
function drawGlow(x, y, size, rgb, alpha = 1) {
  if (size <= 0 || alpha <= 0) return;
  const a = ctx.globalAlpha; ctx.globalAlpha = a * Math.min(1, alpha);
  ctx.drawImage(glowSprite(rgb), x - size / 2, y - size / 2, size, size);
  ctx.globalAlpha = a;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------- 사운드 ---------- */
const Snd = {
  ctx: null, master: null, muted: false, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const A = window.AudioContext || window.webkitAudioContext; this.ctx = new A();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.3; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; this.noise = this.ctx.createBuffer(1, len, len);
      const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok(key, gap) {

    const n = this.ctx.currentTime;
    if (key) { if (this.last[key] && n - this.last[key] < gap) return false; this.last[key] = n; }
    return true;
  },
  tone(f, dur, type, vol, f2) {
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  burst(dur, vol, freq, f2) {
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur);
  },
  swap() { if (this.ok('swap', 0.05)) this.burst(0.15, 0.12, 4000, 800); },
  bad() { if (this.ok()) { this.tone(160, 0.18, 'square', 0.06, 110); } },
  pop(cascade) { if (this.ok('pop', 0.05)) { const n = [0, 4, 7, 12, 16, 19, 24][Math.min(6, cascade - 1)]; this.tone(660 * Math.pow(2, n / 12), 0.18, 'triangle', 0.1); this.tone(1320 * Math.pow(2, n / 12), 0.1, 'sine', 0.04); } },
  land() { if (this.ok('land', 0.06)) this.tone(220, 0.05, 'sine', 0.05, 150); },
  zap() { if (this.ok('zap', 0.06)) { this.tone(1800, 0.3, 'sawtooth', 0.05, 200); this.burst(0.25, 0.15, 6000, 1000); } },
  boom() { if (this.ok('boom', 0.06)) { this.burst(0.6, 0.45, 2500, 60); this.tone(110, 0.4, 'sawtooth', 0.1, 35); } },
  magic() { if (!this.ok()) return; for (let i = 0; i < 8; i++) setTimeout(() => this.ok() && this.tone(800 + i * 180, 0.15, 'sine', 0.05), i * 35); },
  create() { if (this.ok('create', 0.1)) this.tone(880, 0.25, 'triangle', 0.08, 1760); },
  tick() { if (this.ok('tick', 0.03)) this.tone(1500, 0.04, 'square', 0.03); },
  clear() { if (!this.ok()) return; [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => setTimeout(() => this.ok() && this.tone(f, 0.25, 'triangle', 0.1), i * 90)); },
  fail() { if (!this.ok()) return; [440, 392, 349, 262].forEach((f, i) => setTimeout(() => this.ok() && this.tone(f, 0.3, 'triangle', 0.09), i * 160)); },
};

/* ---------- 상태 ---------- */
let state = 'title', grid = [], parts = [], texts = [], fx = [], flyers = [], waiters = [];
let score = 0, dispScore = 0, levelScore = 0, target = 0, moves = 0, level = 1, best = 0, bestCascade = 0, specialsUsed = 0;
let busy = false, epoch = 0, sel = null, drag = null, idleT = 0, hint = null, shake = 0, flash = 0, flashColor = C.white, gtime = 0;
let announce = null, overT = 0, newRecord = false, movesPop = 0, scorePop = 0, nextId = 1, cascadeBanner = null;
try { best = +localStorage.getItem('gemCascadeBest') || 0; } catch (e) { best = 0; }

function wait(t) { return new Promise(r => waiters.push({ t, r })); }
function until(fn) { return new Promise(r => waiters.push({ fn, r })); }
function addShake(v) { shake = Math.max(shake, v); }
function doFlash(a, rgb = C.white) { flash = Math.max(flash, a); flashColor = rgb; }
function showAnnounce(title, sub, rgb = C.cyan, dur = 2.2) { announce = { title, sub, rgb, t: 0, dur }; }
const cx = c => BX + c * CS + CS / 2, cy = r => BY + r * CS + CS / 2;
const key = (r, c) => r * N + c;

/* ---------- 파티클 ---------- */
function P(o) { if (parts.length < 2500) parts.push(o); }
function addGlow(x, y, vx, vy, size, rgb, life, drag = 0, grow = 1) { P({ k: 0, x, y, vx, vy, size, rgb, life, max: life, drag, grow }); }
function addSpark(x, y, vx, vy, rgb, life, w = 2, drag = 2) { P({ k: 1, x, y, vx, vy, rgb, life, max: life, w, drag }); }
function addRing(x, y, r1, r2, rgb, life, w = 4) { P({ k: 2, x, y, vx: 0, vy: 0, r1, r2, rgb, life, max: life, w }); }
function addShard(x, y, vx, vy, rgb, life, s) { P({ k: 3, x, y, vx, vy, rgb, life, max: life, s, rot: rand(0, TAU), vr: rand(-12, 12), g: 900, drag: 0.5 }); }
function addText(x, y, str, s = 16, rgb = C.white, life = 0.9) { texts.push({ x, y, str, s, rgb, life, max: life }); }

/* ---------- 보석 ---------- */
function makeGem(c, sp = null) { return { id: nextId++, c, sp, x: 0, y: 0, vy: 0, squash: 0, dying: 0, born: 1, flash: 0 }; }
function colorAt(r, c) { const g = grid[r] && grid[r][c]; return g && g.sp !== 'rainbow' ? g.c : -1; }
function fillBoard(drop) {
  grid = [];

    grid.push([]);
    for (let c = 0; c < N; c++) {
      let col, tries = 0;
      do { col = randi(0, NCOL - 1); tries++; }

      const g = makeGem(col); g.x = c; g.y = drop ? r - N - 1.5 - (N - r) * 0.25 - c * 0.12 : r;

function findRuns() {

  for (let c = 0; c < N; c++) { let r = 0; while (r < N) { const col = colorAt(r, c); if (col < 0) { r++; continue; } let e = r + 1; while (e < N && colorAt(e, c) === col) e++; if (e - r >= 3) { const cells = []; for (let y = r; y < e; y++) cells.push([y, c]); runs.push({ dir: 'v', cells, color: col }); } r = e; } }
  return runs;
}
function findGroups() {
  const groups = [];
  for (const run of findRuns()) {
    const keys = run.cells.map(([r, c]) => key(r, c));
    const hits = groups.filter(g => keys.some(k => g.keys.has(k)));
    const ng = { keys: new Set(keys), runs: [run], color: run.color };
    for (const h of hits) { h.keys.forEach(k => ng.keys.add(k)); ng.runs.push(...h.runs); groups.splice(groups.indexOf(h), 1); }

}
function wouldMatch(r1, c1, r2, c2) {
  const a = grid[r1][c1], b = grid[r2][c2];
  if (!a || !b) return false;
  if (a.sp === 'rainbow' || b.sp === 'rainbow') return true;
  if (a.sp && b.sp) return true;
  grid[r1][c1] = b; grid[r2][c2] = a;
  const ok = findRuns().length > 0;
  grid[r1][c1] = a; grid[r2][c2] = b;
  return ok;
}
function findMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (c < N - 1 && wouldMatch(r, c, r, c + 1)) return [[r, c], [r, c + 1]];

}

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const g = grid[r][c]; if (g && (g.x !== c || g.y !== r || g.vy !== 0)) return false; }
  return true;
}
function collapse() {
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) if (grid[r][c]) { if (r !== w) { grid[w][c] = grid[r][c]; grid[r][c] = null; } w--; }
    const missing = w + 1;
    for (let r = w; r >= 0; r--) { const g = makeGem(randi(0, NCOL - 1)); g.x = c; g.y = r - missing - 0.6; grid[r][c] = g; }

/* ---------- 특수 보석 발동 ---------- */
function expandSpecials(clear, colorHint) {
  const queue = [...clear], done = new Set();
  while (queue.length) {
    const k = queue.pop(), r = Math.floor(k / N), c = k % N, g = grid[r][c];
    if (!g || !g.sp || done.has(k)) continue;
    done.add(k); specialsUsed++;

    if (g.sp === 'h') { for (let x = 0; x < N; x++) area.push([r, x]); fx.push({ t: 'beam', dir: 'h', r, c, life: 0.5, max: 0.5, rgb: GRGB[g.c] }); Snd.zap(); addShake(8); }
    else if (g.sp === 'v') { for (let y = 0; y < N; y++) area.push([y, c]); fx.push({ t: 'beam', dir: 'v', r, c, life: 0.5, max: 0.5, rgb: GRGB[g.c] }); Snd.zap(); addShake(8); }
    else if (g.sp === 'bomb') {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const y = r + dr, x = c + dc; if (y >= 0 && y < N && x >= 0 && x < N) area.push([y, x]); }

/* ---------- 턴 처리 ---------- */
async function trySwap(r1, c1, r2, c2) {
  if (busy || state !== 'play') return;
  const a = grid[r1][c1], b = grid[r2][c2]; if (!a || !b) return;
  busy = true; sel = null; hint = null; idleT = 0;
  const ep = epoch;
  grid[r1][c1] = b; grid[r2][c2] = a; Snd.swap();
  await until(settled); if (ep !== epoch) return;

    first = new Set([key(r1, c1), key(r2, c2)]);
    if (a.sp === 'rainbow' && b.sp === 'rainbow') { for (let k = 0; k < N * N; k++) first.add(k); }

    Snd.bad();
    grid[r1][c1] = a; grid[r2][c2] = b; a.flash = 0.3; b.flash = 0.3;
    await until(settled); if (ep !== epoch) return;
    busy = false; return;

  await resolve(first, [[r2, c2], [r1, c1]], ep); if (ep !== epoch) return;

async function resolve(first, swapCells, ep) {
  let cascade = 0;
  while (true) {
    let clear, creates = [];
    if (first) { clear = first; first = null; }
    else {
      const groups = findGroups();
      if (!groups.length) break;
      clear = new Set();
      for (const g of groups) {
        g.keys.forEach(k => clear.add(k));
        const hasH = g.runs.some(r => r.dir === 'h'), hasV = g.runs.some(r => r.dir === 'v');
        const maxLen = Math.max(...g.runs.map(r => r.cells.length)), longest = g.runs.find(r => r.cells.length === maxLen);
        let sp = null;
        if (maxLen >= 5) sp = 'rainbow'; else if (hasH && hasV) sp = 'bomb'; else if (maxLen === 4) sp = longest.dir;
        if (!sp) continue;
        let pos = null;
        if (swapCells) for (const [r, c] of swapCells) if (g.keys.has(key(r, c))) { pos = [r, c]; break; }
        if (!pos && sp === 'bomb') { const hk = new Set(g.runs.filter(r => r.dir === 'h').flatMap(r => r.cells.map(([y, x]) => key(y, x)))); for (const r of g.runs.filter(r => r.dir === 'v')) for (const [y, x] of r.cells) if (hk.has(key(y, x))) pos = [y, x]; }
        if (!pos) pos = longest.cells[Math.floor(longest.cells.length / 2)];
        creates.push({ r: pos[0], c: pos[1], color: g.color, sp });
      }
    }
    cascade++;
    if (cascade > bestCascade) bestCascade = cascade;
    // 레인보우 힌트 색상
    let hintColor;
    for (const k of clear) { const g = grid[Math.floor(k / N)][k % N]; if (g && g.sp === 'rainbow' && g.hint !== undefined) hintColor = g.hint; }
    if (hintColor === -1) { for (let k = 0; k < N * N; k++) clear.add(k); hintColor = undefined; }
    expandSpecials(clear, hintColor);
    // 터뜨리기
    let pts = 0, sx = 0, sy = 0, n = 0;

    const t = cascadeBanner.t, s = t < 0.2 ? ease.outBack(t / 0.2) * 1.0 : 1 + (t - 0.2) * 0.05, a = t > 0.8 ? 1 - (t - 0.8) / 0.3 : 1;
    ctx.save(); ctx.translate(W / 2, BY + S * 0.5); ctx.rotate(-0.08); ctx.scale(s, s); ctx.globalAlpha = Math.max(0, a);
    const hue = (gtime * 300) % 360;
    try { ctx.letterSpacing = '4px'; } catch (e) {}
    txt(`CASCADE x${cascadeBanner.n}`, 0, 0, Math.min(46, W / 10), '#fff', 'center', 900, hslRgb(hue, 1, 0.6), 26);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    ctx.restore();
  }
}
function drawHUD() {
  const top = Math.max(16, BY - 120), mid = W / 2;
  txt(`LEVEL ${level}`, BX, top + 14, 13, `rgb(${C.cyan})`, 'left', 900, C.cyan, 8);
  ctx.save(); ctx.translate(BX, top + 48); ctx.scale(1 + scorePop * 0.1, 1 + scorePop * 0.1);
  txt(String(Math.round(dispScore)), 0, 0, 28, '#fff', 'left', 900, C.purple, 14); ctx.restore();
  txt(`BEST ${Math.max(best, score)}`, BX, top + 66, 10, `rgba(${C.gold},0.85)`);
  // 이동 횟수
  const low = moves <= 5, ms = 1 + movesPop * 0.3;
  ctx.save(); ctx.translate(BX + S, top + 50); ctx.scale(ms, ms);
  txt(String(moves), 0, 0, 36, low && Math.sin(gtime * 10) > 0 ? `rgb(${C.red})` : '#fff', 'right', 900, low ? C.red : C.cyan, 14);
  ctx.restore();
  txt('MOVES', BX + S, top + 14, 11, 'rgba(190,200,255,0.8)', 'right');
  // 목표 진행 바
  const bw = S, by = top + 80, prog = clamp(levelScore / Math.max(1, target), 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; rr(BX, by, bw, 10, 5); ctx.fill();
  const g = ctx.createLinearGradient(BX, 0, BX + bw, 0);
  for (let i = 0; i <= 5; i++) g.addColorStop(i / 5, `rgb(${GRGB[i]})`);
  ctx.fillStyle = g; if (prog > 0) { rr(BX, by, Math.max(10, bw * prog), 10, 5); ctx.fill(); }
  ctx.globalCompositeOperation = 'lighter'; drawGlow(BX + bw * prog, by + 5, 40, C.white, 0.6 + 0.3 * Math.sin(gtime * 8)); ctx.globalCompositeOperation = 'source-over';
  txt(`${Math.min(levelScore, target)} / ${target}`, mid, by - 4, 10, 'rgba(220,220,255,0.85)', 'center', 700);
}
function drawAnnounce(dt) {
  const a = announce; if (!a) return;
  a.t += dt;
  const p = a.t / a.dur; if (p >= 1) { announce = null; return; }
  let alpha = 1, sc = 1, spread = 0;
  if (p < 0.14) { const k = p / 0.14; sc = lerp(2.6, 1, ease.outCubic(k)); alpha = k; }
  else if (p > 0.8) { const k = (p - 0.8) / 0.2; alpha = 1 - k; spread = k * 40; sc = 1 + k * 0.15; }
  const y = BY + S * 0.42;
  ctx.save(); ctx.globalAlpha = alpha;
  const lw = Math.min(S * 0.5, 300) * ease.outCubic(Math.min(1, p / 0.3)) * (p > 0.8 ? 1 - (p - 0.8) / 0.2 : 1);
  ctx.fillStyle = 'rgba(8,4,24,0.7)'; ctx.fillRect(W / 2 - lw, y - 50, lw * 2, 76);
  ctx.fillStyle = `rgba(${a.rgb},0.9)`; ctx.fillRect(W / 2 - lw, y - 50, lw * 2, 2); ctx.fillRect(W / 2 - lw, y + 26, lw * 2, 2);
  ctx.translate(W / 2, y); ctx.scale(sc, sc);
  try { ctx.letterSpacing = `${5 + spread}px`; } catch (e) {}
  txt(a.title, 0, 0, Math.min(44, W / 12), '#fff', 'center', 900, a.rgb, 24);
  try { ctx.letterSpacing = `${2 + spread / 3}px`; } catch (e) {}
  txt(a.sub, 0, 46, 14, `rgb(${a.rgb})`, 'center', 700);
  ctx.restore();
}
let titleGems = [];
function drawTitle(dt) {
  // 떨어지는 보석들
  if (titleGems.length < 26 && Math.random() < 0.15) titleGems.push({ c: randi(0, 5), x: rand(0, W), y: -40, vy: rand(50, 150), rot: rand(0, TAU), vr: rand(-2, 2), s: rand(0.6, 1.3) });
  for (const g of titleGems) { g.vy += 300 * dt; g.y += g.vy * dt; g.rot += g.vr * dt; if (g.y > H - 30 && g.vy > 0) { g.y = H - 30; g.vy *= -0.55; g.vr *= 0.8; if (Math.abs(g.vy) < 60) g.dead = true; } }
  titleGems = titleGems.filter(g => !g.dead);
  for (const g of titleGems) { ctx.save(); ctx.globalAlpha = 0.4; ctx.translate(g.x, g.y); ctx.rotate(g.rot); ctx.scale(g.s, g.s); ctx.drawImage(gemSprites[g.c], -CS / 2, -CS / 2, CS, CS); ctx.restore(); }
  const cx0 = W / 2, cy0 = H * 0.3, size = Math.min(80, W / 8);
  ['GEM', 'CASCADE'].forEach((word, wi) => {
    const s = wi ? size * 0.75 : size;
    ctx.font = `900 ${s}px ${FONT}`;
    const chars = word.split(''), gap = s * 0.06, widths = chars.map(ch => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + gap * (chars.length - 1);
    let x = cx0 - total / 2;
    chars.forEach((ch, i) => {
      const d = 0.08 * (i + wi * 3), intro = clamp((gtime - d) / 0.5, 0, 1);
      const yy = cy0 + wi * size * 1.0 + Math.sin(gtime * 2.5 + i * 0.5) * 4;
      const sc = ease.outBack(intro);
      ctx.save(); ctx.translate(x + widths[i] / 2, yy - s * 0.35); ctx.scale(sc, sc); ctx.rotate((1 - intro) * 2);
      const col = GRGB[(i + wi * 2) % 6];
      ctx.shadowColor = `rgba(${col},0.9)`; ctx.shadowBlur = 22;
      const g = ctx.createLinearGradient(0, -s * 0.6, 0, s * 0.3);
      g.addColorStop(0, '#fff'); g.addColorStop(1, `rgb(${col})`);
      ctx.fillStyle = g; ctx.font = `900 ${s}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, 0, 0);
      ctx.restore();
      x += widths[i] + gap;
    });
  });
  const blink = 0.55 + 0.45 * Math.sin(gtime * 4);
  ctx.globalAlpha = blink;
  txt('클릭 또는 SPACE 키로 시작', cx0, H * 0.7, Math.min(20, W / 22), '#fff', 'center', 700, C.pink, 14);
  ctx.globalAlpha = 1;
  ['보석을 드래그해 같은 색 3개를 맞추세요', '4개 → 줄 폭탄 · L/T자 → 폭탄 · 5개 → 무지개'].forEach((h, i) => txt(h, cx0, H * 0.76 + i * 22, 13, 'rgba(210,200,255,0.85)', 'center', 500));
  if (best > 0) txt(`BEST  ${best}`, cx0, 34, 13, `rgb(${C.gold})`, 'center', 700, C.gold, 8);
}
function drawOver() {
  const k = Math.min(1, overT / 0.8);
  ctx.fillStyle = `rgba(10,4,32,${0.75 * k})`; ctx.fillRect(0, 0, W, H);
  const cx0 = W / 2, cy0 = H * 0.28, size = Math.min(60, W / 9), s = lerp(1.6, 1, ease.outCubic(k));
  ctx.save(); ctx.translate(cx0, cy0); ctx.scale(s, s); ctx.globalAlpha = k;
  txt('GAME OVER', 0, 0, size, '#fff', 'center', 900, C.pink, 24); ctx.restore();
  const rows = [['SCORE', Math.round(score * clamp((overT - 0.5) / 1, 0, 1))], ['LEVEL', level], ['최고 연쇄', `x${bestCascade}`], ['특수 보석 발동', specialsUsed]];
  rows.forEach((r, i) => {
    const t = clamp((overT - 0.4 - i * 0.15) / 0.4, 0, 1); if (t <= 0) return;
    const x = cx0 + (1 - ease.outCubic(t)) * 120, y = cy0 + 70 + i * 36;
    ctx.globalAlpha = t;
    txt(r[0], x - 130, y, 14, 'rgba(210,200,255,0.8)'); txt(String(r[1]), x + 130, y, 20, '#fff', 'right', 900, C.purple, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x - 130, y + 10, 260, 1); ctx.globalAlpha = 1;
  });
  if (newRecord && overT > 1.4) {
    ctx.save(); ctx.translate(cx0, cy0 + 230); const s2 = 1 + Math.sin(gtime * 6) * 0.06; ctx.scale(s2, s2);
    txt('★ NEW RECORD ★', 0, 0, 22, `hsl(${(gtime * 200) % 360},100%,70%)`, 'center', 900, C.gold, 16); ctx.restore();
  }
  if (overT > 1) { ctx.globalAlpha = 0.55 + 0.45 * Math.sin(gtime * 4); txt('클릭 또는 SPACE 키로 다시 시작', cx0, cy0 + 280, 16, '#fff', 'center', 700, C.pink, 10); ctx.globalAlpha = 1; }
}

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; gtime += dt;
  if (state !== 'title') update(dt);
  if (state === 'over') overT += dt;
  shake *= Math.exp(-dt * 9); flash = Math.max(0, flash - dt * 2.5);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBackground();
  if (state === 'title') drawTitle(dt);
  else {
    ctx.save(); if (shake > 0.3) ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
    drawBoard(); drawFx(); drawFlyers(); drawParts(); drawTexts();
    ctx.restore();
    drawHUD(); drawAnnounce(dt);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(${flashColor},${Math.min(0.7, flash)})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'over') drawOver();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
